name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build CLI
        run: go build ./cmd/hot-take

  release-alpha:
    # Only the explicitly named release commit can publish this fixed alpha.
    # Ordinary pushes and pull requests retain read-only permissions.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: v0.1.0-alpha.1'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-v0.1.0-alpha.1
      cancel-in-progress: false
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Publish developer alpha
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0-alpha.1 >/dev/null 2>&1; then
            tag_sha="$(gh api repos/{owner}/{repo}/git/ref/tags/v0.1.0-alpha.1 --jq '.object.sha')"
            test "$tag_sha" = "$RELEASE_SHA"
            exit 0
          fi
          gh release create v0.1.0-alpha.1 \
            --target "$RELEASE_SHA" \
            --title "Hot Take v0.1.0-alpha.1" \
            --notes-file docs/releases/v0.1.0-alpha.1.md \
            --prerelease --latest=false
